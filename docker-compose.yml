# ============================================================
# TruthLens Docker Compose — Full Stack Orchestration
# ============================================================
# Usage:
#   1. Copy .env.example to .env and fill in your values
#   2. docker-compose up --build
#   3. Access the app at http://localhost
# ============================================================

services:

  # --------------------------------------------------------
  # MongoDB Database
  # --------------------------------------------------------
  mongodb:
    image: mongo:7
    container_name: truthlens-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------
  # Python NLP Service (Sentence Transformers)
  # --------------------------------------------------------
  nlp-service:
    build:
      context: ./nlp-service
      dockerfile: Dockerfile
    container_name: truthlens-nlp
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --------------------------------------------------------
  # Spring Boot Backend
  # --------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: truthlens-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/truthlens
      - SERPER_API_KEY=${SERPER_API_KEY}
      - NLP_SERVICE_URL=http://nlp-service:8000/similarity
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:8088,http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:8088
      - PORT=8080
    expose:
      - "8080"
    depends_on:
      mongodb:
        condition: service_healthy
      nlp-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --------------------------------------------------------
  # React Frontend (nginx)
  # --------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: truthlens-frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8080
    ports:
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongodb_data:
    driver: local
